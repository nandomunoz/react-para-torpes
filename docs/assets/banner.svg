    <circle cx="43" cy="62" r="17" fill="#f4f4ef" stroke="#0b0b0b" stroke-width="5"/>
    <circle cx="79" cy="66" r="17" fill="#f4f4ef" stroke="#0b0b0b" stroke-width="5"/>
    <path d="M60 63l2 2" stroke="#0b0b0b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="64" r="5" fill="#0b0b0b"/><circle cx="74" cy="68" r="5" fill="#0b0b0b"/>
    <path d="M44 93c6-6 10 4 16-1s10 3 16-2" fill="none" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round"/>
